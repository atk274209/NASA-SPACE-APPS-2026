# Routine examinations (master prompt Module M).
#
# !!! DEMONSTRATION CONTENT: NOT A MEDICAL PROTOCOL !!!
# The intervals below are placeholders chosen only so the scheduling, reminders and gamification
# can be exercised in a short simulated mission. They are not clinical or NASA intervals. Before
# any operational use the mission's medical operations team must replace them.
#
# AM schedules the exam, reminds the astronaut and the doctor, and stores the results the
# astronaut ENTERS. AM never fabricates or interprets a result.

version: "demo-exams-0.1"
label: "DEMO: placeholder intervals, not a medical protocol"

exams:
  - code: blood_test
    title: "Blood sample"
    detail: "Collect and process the blood sample as described in your onboard procedure; enter what the procedure tells you to record."
    procedure_ref: AM-DEMO-EXAM-01
    every_days: 14
    first_day: 3
  - code: urine_test
    title: "Urine sample"
    detail: "Collect the urine sample per the onboard procedure and enter the recorded values."
    procedure_ref: AM-DEMO-EXAM-02
    every_days: 7
    first_day: 2
  - code: reflex_test
    title: "Reflex check (nervous system)"
    detail: "Run the reflex check with the crew medical officer per procedure; enter the result as recorded."
    procedure_ref: AM-DEMO-EXAM-03
    every_days: 7
    first_day: 4
  - code: eye_exam
    title: "Eye examination"
    detail: "Complete the vision and eye check per procedure; enter the recorded result."
    procedure_ref: AM-DEMO-EXAM-04
    every_days: 30
    first_day: 5

# Points for adherence only. Points never depend on a health value, so gamification can never
# reward an unhealthy result or hide one.
points:
  daily_task_done: 10
  checkin_done: 5
  exam_on_time: 25
  exam_late: 10
level_size: 100
